# Nixpacks configuration for Render
# Enables both Node.js and Python in the build environment

[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "python311Packages.numpy"]

[phases.install]
cmds = [
    "pip install pandas numpy scikit-learn joblib",
    "npm ci"
]

[start]
cmd = "npm start"
